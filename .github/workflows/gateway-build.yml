name: gateway-build

# 手动触发 + 推送到 main 时构建 Linux 网关二进制。
# 目的是把「出二进制」这件事从构建机挪到 CI：本地只做 cargo check 做类型校验，
# 产物从 artifact 下载后部署，避免在 3 核机器上串行等 20~30 分钟。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 构建目标
        type: choice
        default: aether-gateway
        options:
          - aether-gateway
          - aether-tunnel
  push:
    branches:
      - main
    paths:
      - "apps/aether-gateway/**"
      - "crates/**"
      # 前端也必须触发：只改 frontend/ 时不跑，类型错误会一直漏到部署才发现
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gateway-build.yml"
  pull_request:
    paths:
      - "apps/aether-gateway/**"
      - "crates/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: gateway-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # dev profile 去掉调试信息：显著降低磁盘占用和链接内存，
  # 产物大小也小很多（部署用的是自建二进制，不需要调试符号）。
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  build:
    name: build-linux-binary
    # 必须用与部署目标一致的发行版：产物要拿到 Debian 12 (glibc 2.36) 上直接跑。
    # ubuntu-latest 是 24.04 / glibc 2.39，编出来的二进制在目标机上会报
    # "GLIBC_2.38 not found" 并且起不来。
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build nasm \
            pkg-config libssl-dev build-essential ca-certificates curl git \
            build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.95.0 --profile minimal
          # 必须写死 $HOME/.cargo：rustup 安装脚本不保证导出 CARGO_HOME 变量，
          # 写成 "$CARGO_HOME/bin" 会展开成 /bin，下一步直接 cargo: command not found (127)
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 记录编译环境的 glibc，部署时可直接比对，避免再次出现版本不匹配。
      # 只落文件、不写 GITHUB_ENV：值里带小数点会让 env 文件解析报错，而这个变量
      # 本来也没有任何步骤需要消费。
      - name: Record glibc
        run: ldd --version | head -1 | tee glibc-version.txt

      - name: Select target
        id: sel
        run: |
          case "${{ inputs.target || 'aether-gateway' }}" in
            aether-tunnel) echo "name=aether-tunnel" >> "$GITHUB_OUTPUT" ;;
            *)             echo "name=aether-gateway" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: |
          # build.rs 的优先级是 AETHER_BUILD_VERSION > AETHER_VERSION > GITHUB_REF_NAME。
          # 分支构建时 GITHUB_REF_NAME 是分支名，会把 /api/admin/system/version
          # 报成 "feature/xxx"。这里从 Cargo.toml 取真实版本注入，
          # 与 git tag 保持一致，且不用在每次改版本时回来改 CI。
          AETHER_VERSION="$(awk -F'"' '/^name = "aether-gateway"$/{f=1;next} f && /^version = /{print $2; exit}' "apps/${{ steps.sel.outputs.name }}/Cargo.toml")"
          echo "AETHER_VERSION=${AETHER_VERSION}"
          export AETHER_VERSION

          cargo build --locked \
            -j 2 \
            -p "${{ steps.sel.outputs.name }}" \
            --bin "${{ steps.sel.outputs.name }}"

      # 自检：产物必须能在本次构建的发行版上直接执行，
      # 否则在部署机上才发现 glibc 不匹配就太晚了。
      - name: Smoke test binary
        run: |
          chmod +x "target/debug/${{ steps.sel.outputs.name }}"
          "target/debug/${{ steps.sel.outputs.name }}" --help > /dev/null 2>&1 \
            || "target/debug/${{ steps.sel.outputs.name }}" --version
          echo "binary is runnable on $(cat glibc-version.txt)"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aether-${{ steps.sel.outputs.name }}-linux
          path: |
            target/debug/${{ steps.sel.outputs.name }}
            glibc-version.txt
          retention-days: 14
          if-no-files-found: error

  check:
    name: cargo-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: gateway-check
          key: check
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build nasm \
            pkg-config libssl-dev build-essential
      - name: Check gateway lib
        run: cargo check --locked -j 2 -p aether-gateway --lib

  test:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # libtest 把每个用例跑在 RUST_MIN_STACK 指定的栈上，不设就是平台默认的 2 MiB。
    # 而 main.rs 里 tokio worker 显式给了 8 MiB（GATEWAY_TOKIO_WORKER_STACK_SIZE_BYTES），
    # 两者对不上时，测试会替生产捏造一个不存在的风险：run_request ->
    # execute_stream_from_frame_stream -> async_stream::stream! 这条嵌套链一次 poll 到底，
    # debug 构建下单次 poll 的栈帧总量就能撑爆 2 MiB，报 thread has overflowed its stack。
    #
    # 栈溢出是 abort 不是断言失败：整个测试进程当场死掉，后面上千个用例一个都跑不到。
    # 全量跑测试就是为了不再有"绿只覆盖了一部分"，所以这里必须给足栈。
    # 取值与生产的 worker 栈一致，不是随手写的数字。
    env:
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: gateway-test
          key: test
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build nasm \
            pkg-config libssl-dev build-essential
      # 装 PostgreSQL 只为一件事：让 ManagedPostgresServer 能拉起临时库，
      # 从而让 control/auth/resolution.rs 里那两个"两节点各自缓存都命中、
      # 强一致读仍要穿透到库"的用例真正被执行。
      #
      # 这两个用例覆盖的是缓存穿透这一层，删掉等于把保护悄悄丢掉；标成
      # #[ignore] 长期不跑同样糟——常红的用例会让人把新失败也当成已知问题。
      - name: Install PostgreSQL for managed test databases
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          sudo systemctl stop postgresql || true
      # Debian/Ubuntu 的 postgresql 包**不把 initdb/postgres/pg_ctl 放进 PATH**
      # （只有 pg_ctlcluster 之类的包装脚本），所以必须显式告诉 testkit 去哪找。
      # 这里不写死版本号：发行版升级后 16 会变 17，写死就会在某天静默找不到。
      # 跑一次 --version 是为了在装错的时候立刻失败，而不是等测试超时。
      - name: Locate PostgreSQL binaries
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$PGBIN" ]; then echo "POSTGRES_BINARIES_NOT_FOUND"; exit 1; fi
          echo "AETHER_INITDB_BIN=$PGBIN/initdb"  >> "$GITHUB_ENV"
          echo "AETHER_POSTGRES_BIN=$PGBIN/postgres" >> "$GITHUB_ENV"
          echo "AETHER_PG_CTL_BIN=$PGBIN/pg_ctl"    >> "$GITHUB_ENV"
          "$PGBIN/initdb" --version
      # 跑**全量** lib 测试，而不是按名字过滤。
      #
      # 之前这里写的是 `--lib opencode`，于是 job 名叫 unit-tests、状态是绿的，
      # 但名字里没有 opencode 的用例一个都没跑。两个需要真实 PostgreSQL 的
      # auth 用例就长期停在这个过滤器之外、一直红着而没人看见。
      # 绿只覆盖被过滤到的那部分，是比红更危险的信号。
      - name: Run gateway lib tests
        run: cargo test --locked -j 2 -p aether-gateway --lib
      - name: Run transport tests
        run: cargo test --locked -j 2 -p aether-provider-transport --lib

  frontend:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 本仓库跟踪的是 package-lock.json（根目录与 frontend/ 各一份），
      # 没有 pnpm-lock.yaml，所以只能用 npm + cache:'npm'。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      # 本地跑不了这一步：Windows 上已安装的 node_modules 是 pnpm 布局的软链，
      # Node stat 会报 EPERM，所以类型检查与打包都放在 CI 上做。
      - name: Type check
        run: npx vue-tsc -b --force
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend
