name: gateway-build

# 手动触发 + 推送到 main 时构建 Linux 网关二进制。
# 目的是把「出二进制」这件事从构建机挪到 CI：本地只做 cargo check 做类型校验，
# 产物从 artifact 下载后部署，避免在 3 核机器上串行等 20~30 分钟。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 构建目标
        type: choice
        default: aether-gateway
        options:
          - aether-gateway
          - aether-tunnel
  push:
    branches:
      - main
    paths:
      - "apps/aether-gateway/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gateway-build.yml"
  pull_request:
    paths:
      - "apps/aether-gateway/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: gateway-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # dev profile 去掉调试信息：显著降低磁盘占用和链接内存，
  # 产物大小也小很多（部署用的是自建二进制，不需要调试符号）。
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  build:
    name: build-linux-binary
    # 必须用与部署目标一致的发行版：产物要拿到 Debian 12 (glibc 2.36) 上直接跑。
    # ubuntu-latest 是 24.04 / glibc 2.39，编出来的二进制在目标机上会报
    # "GLIBC_2.38 not found" 并且起不来。
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build nasm \
            pkg-config libssl-dev build-essential ca-certificates curl git \
            build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.95.0 --profile minimal
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # 记录编译环境的 glibc，部署时可直接比对，避免再次出现版本不匹配。
      # 只落文件、不写 GITHUB_ENV：值里带小数点会让 env 文件解析报错，而这个变量
      # 本来也没有任何步骤需要消费。
      - name: Record glibc
        run: ldd --version | head -1 | tee glibc-version.txt

      - name: Select target
        id: sel
        run: |
          case "${{ inputs.target || 'aether-gateway' }}" in
            aether-tunnel) echo "name=aether-tunnel" >> "$GITHUB_OUTPUT" ;;
            *)             echo "name=aether-gateway" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: |
          cargo build --locked \
            -j 2 \
            -p "${{ steps.sel.outputs.name }}" \
            --bin "${{ steps.sel.outputs.name }}"

      # 自检：产物必须能在本次构建的发行版上直接执行，
      # 否则在部署机上才发现 glibc 不匹配就太晚了。
      - name: Smoke test binary
        run: |
          chmod +x "target/debug/${{ steps.sel.outputs.name }}"
          "target/debug/${{ steps.sel.outputs.name }}" --help > /dev/null 2>&1 \
            || "target/debug/${{ steps.sel.outputs.name }}" --version
          echo "binary is runnable on $(cat glibc-version.txt)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ steps.sel.outputs.name }}-linux
          path: |
            target/debug/${{ steps.sel.outputs.name }}
            glibc-version.txt
          retention-days: 14
          if-no-files-found: error

  check:
    name: cargo-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gateway-check
          key: check
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build nasm \
            pkg-config libssl-dev build-essential
      - name: Check gateway lib
        run: cargo check --locked -j 2 -p aether-gateway --lib

  test:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gateway-test
          key: test
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build nasm \
            pkg-config libssl-dev build-essential
      # 覆盖 opencode 出口 IP 池、传输层 pin、CIDR 解析、冷却与游标逻辑。
      # 这些测试此前只在 Windows 上做过类型检查，从未真正执行过。
      - name: Run opencode / transport / rotation tests
        run: |
          cargo test --locked -j 2 -p aether-gateway --lib \
            opencode -- --nocapture
          cargo test --locked -j 2 -p aether-provider --lib opencode -- --nocapture

  frontend:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # 本仓库跟踪的是 package-lock.json（根目录与 frontend/ 各一份），
      # 没有 pnpm-lock.yaml，所以只能用 npm + cache:'npm'。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      # 本地跑不了这一步：Windows 上已安装的 node_modules 是 pnpm 布局的软链，
      # Node stat 会报 EPERM，所以类型检查与打包都放在 CI 上做。
      - name: Type check
        run: npx vue-tsc -b --force
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend
