[package]
name = "aether-tls-hello"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "手工构造 TLS ClientHello（用于复刻特定客户端的 JA3 指纹）"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
ml-kem = "0.2"
rand = "0.8"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rustls-pki-types = "1"
rustls-webpki = "0.102"
webpki-roots = "0.26"

[dev-dependencies]
md-5 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
ml-kem = "0.2"
rand = "0.8"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rustls-pki-types = "1"
rustls-webpki = "0.102"
webpki-roots = "0.26"

[[example]]
name = "handshake_probe"
path = "examples/handshake_probe.rs"
